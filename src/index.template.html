<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>N3 단어</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f4f6; --card:#ffffff; --ink:#1d1d1f; --sub:#6b6b70; --line:#e2e3e7; --soft:#f7f7f9;
  --accent:#c2410c; --accent-ink:#ffffff; --star:#d97706;
  --good:#15803d; --ing:#b45309; --fail:#b91c1c; --not:#6b7280;
  --ok-bg:#e8f5ec; --no-bg:#fdecec;
}
@media (prefers-color-scheme: dark){
  :root{ color-scheme:dark;
    --bg:#141416; --card:#1e1e21; --ink:#f2f2f3; --sub:#a0a0a8; --line:#2e2e33; --soft:#26262a;
    --accent:#fb923c; --accent-ink:#1a1a1a; --star:#fbbf24;
    --good:#4ade80; --ing:#fbbf24; --fail:#f87171; --not:#9ca3af;
    --ok-bg:#15301f; --no-bg:#3a1a1a;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;padding:16px 16px 20px;min-height:100vh}
.jp{font-family:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif}
.wrap{width:100%;max-width:780px;display:flex;flex-direction:column;gap:12px}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.tabs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.tab{border:0;background:none;padding:7px 16px;border-radius:9px;cursor:pointer;color:var(--sub);font-weight:500}
.tab.on{background:var(--ink);color:var(--bg)}
.chip{border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.scope{font-size:13px;color:var(--sub);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.scope b{color:var(--ink)}
.progress{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.progress>div{height:100%;background:var(--accent);transition:width .15s}

/* panel */
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px}
.panel h3{margin:0;font-size:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.lbl{font-size:12px;color:var(--sub);font-weight:500}
.num{width:90px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--soft);color:var(--ink);font:inherit}
select{padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--soft);color:var(--ink);font:inherit}
.check{display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 16px;font-size:14px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn:disabled{opacity:.45;cursor:default}
.hint{font-size:12px;color:var(--sub);line-height:1.6}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:16px;text-align:center;font-size:13px;color:var(--sub);cursor:pointer}
.drop.over,body.dragging .drop{border-color:var(--accent);color:var(--accent)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}

/* card */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px 28px 28px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 30px rgba(0,0,0,.05)}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub);gap:8px}
.no{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink);font-size:15px}
.badge{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;border:1px solid currentColor;margin-left:8px}
.s-Good{color:var(--good)} .s-ing{color:var(--ing)} .s-Fail{color:var(--fail)} .s-NotYet{color:var(--not)}
.star{border:0;background:none;font-size:20px;cursor:pointer;color:var(--line);padding:0 0 0 6px;line-height:1}
.star.on{color:var(--star)}
.wrongtag{font-size:11px;color:var(--fail);border:1px solid var(--fail);border-radius:6px;padding:1px 6px;margin-left:6px}
.head{text-align:center;margin:26px 0 6px}
.word{font-weight:700;font-size:clamp(52px,12vw,104px);line-height:1.1;letter-spacing:.02em;word-break:keep-all}
.kana{font-size:clamp(20px,4.5vw,28px);color:var(--accent);margin-top:10px;font-weight:500}
.pron{font-size:16px;color:var(--sub);margin-top:4px}
.meaning{text-align:center;font-size:clamp(22px,5vw,32px);font-weight:700;margin:20px 0 4px}
.ex{border-top:1px solid var(--line);margin-top:22px;padding-top:16px;text-align:center}
.ex .j{font-size:18px}
.ex .k{font-size:14px;color:var(--sub);margin-top:6px}
.memo{font-size:12px;color:var(--sub);text-align:center;margin-top:12px}
.hidden .reveal{visibility:hidden}
.hint-reveal{display:none;text-align:center;color:var(--sub);font-size:14px}
.hidden .hint-reveal{display:block}
.nav{display:flex;gap:10px;justify-content:center}
.keys{font-size:12px;color:var(--sub);text-align:center;line-height:1.9}
kbd{font-family:inherit;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--card);font-size:11px}
.empty{text-align:center;color:var(--sub);padding:50px 0;line-height:1.8}

/* test */
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.answers input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink);font:inherit;font-size:18px}
.answers input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.score{display:flex;gap:10px;flex-wrap:wrap}
.stat{flex:1;min-width:120px;background:var(--soft);border-radius:12px;padding:12px 14px}
.stat .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--sub)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:640px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--soft);font-weight:500;color:var(--sub);font-size:12px;position:sticky;top:0}
tr.ok td{background:var(--ok-bg)} tr.no td{background:var(--no-bg)}
td.w{font-size:16px;font-weight:700}
.mine{color:var(--ink)} .corr{color:var(--sub);font-size:12px}
.ox{display:flex;gap:4px}
.ox button{border:1px solid var(--line);background:var(--card);border-radius:7px;padding:3px 8px;cursor:pointer;font-size:12px;font-weight:700;color:var(--sub)}
.ox button.onO{background:var(--good);border-color:var(--good);color:#fff}
.ox button.onX{background:var(--fail);border-color:var(--fail);color:#fff}
@media (max-width:560px){.card{padding:20px 16px}.answers{grid-template-columns:1fr}.keys{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="tabs">
      <button class="tab" id="tabStudy">학습</button>
      <button class="tab" id="tabTest">테스트</button>
    </div>
    <div class="row">
      <button class="chip" id="scopeBtn">범위 설정</button>
      <button class="chip" id="importBtn">불러오기</button>
    </div>
  </div>

  <div class="panel" id="scopePanel" hidden>
    <h3>볼 단어 고르기</h3>
    <div class="row" style="gap:18px;align-items:flex-end">
      <div class="field"><label for="fFrom">번호 범위</label>
        <div class="row"><input class="num" id="fFrom" type="number" min="1"> ~ <input class="num" id="fTo" type="number" min="1"></div></div>
      <div class="field"><label for="fTopic">주제</label><select id="fTopic"></select></div>
    </div>
    <div class="field"><span class="lbl">학습상태 (선택 안 하면 전체)</span><div class="row" id="fStatus"></div></div>
    <div class="row" style="gap:18px">
      <label class="check"><input type="checkbox" id="fStar"> ★ 표시한 단어만</label>
      <label class="check"><input type="checkbox" id="fWrong"> 오답 모음만</label>
    </div>
    <div class="row" style="justify-content:space-between">
      <span class="hint" id="fCount"></span>
      <div class="row">
        <button class="btn" id="fReset">초기화</button>
        <button class="btn primary" id="fApply">적용</button>
      </div>
    </div>
  </div>

  <div class="panel" id="importPanel" hidden>
    <h3>파일 불러오기</h3>
    <div class="drop" id="drop">CSV 파일을 여기에 끌어다 놓거나 <u>눌러서 선택</u><input type="file" id="file" accept=".csv,text/csv" hidden></div>
    <div class="hint">
      <b>단어장 CSV</b>: 구글 시트에서 파일 → 다운로드 → CSV. 번호·학습상태·주제·한자/표기·히라가나·한국어 뜻·예문·예문 한글뜻·한글 발음 열을 읽어 단어 목록을 교체해요.<br>
      <b>채점표 CSV</b>: Claude가 만든 채점표를 넣으면 최종이 X·△인 단어를 오답 모음에 추가해요.
    </div>
    <div class="row" style="justify-content:space-between">
      <span class="hint" id="dataInfo"></span>
      <div class="row">
        <button class="btn" id="clearWrong">오답 모음 비우기</button>
        <button class="btn" id="restoreDefault">기본 단어장으로 되돌리기</button>
      </div>
    </div>
  </div>

  <div class="scope"><span id="scopeText"></span><span id="posText"></span></div>
  <div class="progress"><div id="bar"></div></div>

  <!-- study -->
  <section id="study">
    <div class="card" id="card"></div>
    <div class="nav" style="margin-top:14px">
      <button class="btn" id="prev">← 이전</button>
      <button class="btn" id="hideBtn">뜻 가리기</button>
      <button class="btn" id="shuffleBtn">섞기</button>
      <button class="btn" id="next">다음 →</button>
    </div>
    <div class="keys" style="margin-top:10px"><kbd>←</kbd> <kbd>→</kbd> 이동 · <kbd>Space</kbd> 뜻 가리기 · <kbd>F</kbd> ★ 표시 · <kbd>S</kbd> 섞기 · <kbd>Home</kbd> <kbd>End</kbd> 처음/끝</div>
  </section>

  <!-- test -->
  <section id="test" hidden></section>
</div>
<div class="toast" id="toast"></div>

<script>
const DEFAULT_WORDS = __DATA__;
const LS = {
  get(k, d){ try{ const v = localStorage.getItem("n3v2_" + k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("n3v2_" + k, JSON.stringify(v)); }catch(e){} }
};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const stCls = s => "s-" + String(s).replace(/\s/g,"");
function toast(msg){ const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2600); }

/* ---------- state ---------- */
let WORDS = LS.get("words", null) || DEFAULT_WORDS;
let dataSource = LS.get("source", "기본 단어장");
let stars = new Set(LS.get("stars", []));
let wrong = new Set(LS.get("wrong", []));
const DEFAULT_SCOPE = {from:1, to:170, status:[], topic:"", star:false, wrong:false};
let scope = Object.assign({}, DEFAULT_SCOPE, LS.get("scope", {}));
let mode = LS.get("mode", "study");
let deck = [], idx = 0, quiz = false, shuffled = false;
let test = LS.get("test", null);   // {items:[n], i, ans:{n:{p,m}}, done, grade:{n:{p,m}}}

function byNo(n){ return WORDS.find(w => w.n === n); }
function inScope(w, s = scope){
  if(s.from && w.n < s.from) return false;
  if(s.to && w.n > s.to) return false;
  if(s.status.length && !s.status.includes(w.s)) return false;
  if(s.topic && w.t !== s.topic) return false;
  if(s.star && !stars.has(w.n)) return false;
  if(s.wrong && !wrong.has(w.n)) return false;
  return true;
}
function buildDeck(keepNo){
  deck = WORDS.filter(w => inScope(w));
  if(shuffled) shuffle(deck);
  idx = 0;
  if(keepNo != null){ const i = deck.findIndex(w => w.n === keepNo); if(i >= 0) idx = i; }
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function scopeLabel(){
  const p = [];
  p.push(`${scope.from || 1}–${scope.to || "끝"}번`);
  if(scope.status.length) p.push(scope.status.join("·"));
  if(scope.topic) p.push(scope.topic);
  if(scope.star) p.push("★만");
  if(scope.wrong) p.push("오답만");
  return p.join(" · ");
}

/* ---------- study ---------- */
function renderStudy(){
  const card = $("card");
  $("scopeText").innerHTML = `범위 <b>${esc(scopeLabel())}</b>`;
  if(!deck.length){
    card.className = "card";
    card.innerHTML = `<div class="empty">이 범위에 해당하는 단어가 없어요.<br>범위 설정에서 조건을 바꿔 보세요.</div>`;
    $("posText").textContent = "0단어"; $("bar").style.width = "0"; return;
  }
  idx = Math.max(0, Math.min(idx, deck.length - 1));
  const w = deck[idx];
  card.className = "card" + (quiz ? " hidden" : "");
  card.innerHTML = `
    <div class="meta">
      <div class="row" style="gap:0"><span class="no">No. ${w.n}</span><span class="badge ${stCls(w.s)}">${esc(w.s)}</span>${wrong.has(w.n) ? '<span class="wrongtag">오답</span>' : ""}<button class="star ${stars.has(w.n) ? "on" : ""}" id="starBtn" title="F">★</button></div>
      <div>${esc(w.t)}</div>
    </div>
    <div class="head">
      <div class="word jp">${esc(w.w)}</div>
      <div class="reveal">
        ${w.w === w.k ? "" : `<div class="kana jp">${esc(w.k)}</div>`}
        <div class="pron">[${esc(w.p)}]</div>
      </div>
    </div>
    <div class="meaning reveal">${esc(w.m)}</div>
    <div class="hint-reveal">Space를 눌러 발음·뜻 보기</div>
    ${w.e ? `<div class="ex reveal"><div class="j jp">${esc(w.e)}</div><div class="k">${esc(w.ek)}</div></div>` : ""}
    ${w.memo ? `<div class="memo reveal">기출 ${esc(w.memo)}</div>` : ""}`;
  $("starBtn").onclick = e => { e.stopPropagation(); toggleStar(); };
  $("posText").textContent = `${idx+1} / ${deck.length}`;
  $("bar").style.width = ((idx+1)/deck.length*100) + "%";
  $("hideBtn").textContent = quiz ? "뜻 보기" : "뜻 가리기";
  $("shuffleBtn").textContent = shuffled ? "번호순" : "섞기";
  LS.set("pos", w.n);
}
function move(d){ if(!deck.length) return; idx = (idx + d + deck.length) % deck.length; renderStudy(); }
function toggleStar(){
  const w = deck[idx]; if(!w) return;
  stars.has(w.n) ? stars.delete(w.n) : stars.add(w.n);
  LS.set("stars", [...stars]); renderStudy();
}

/* ---------- scope panel ---------- */
const STATUSES = ["Fail","ing","Not Yet","Good"];
let draft = null;
function openScope(){
  draft = JSON.parse(JSON.stringify(scope));
  $("fFrom").value = draft.from || ""; $("fTo").value = draft.to || "";
  const topics = [...new Set(WORDS.map(w => w.t).filter(Boolean))].sort();
  $("fTopic").innerHTML = `<option value="">전체</option>` + topics.map(t => `<option ${t===draft.topic?"selected":""}>${esc(t)}</option>`).join("");
  $("fStar").checked = draft.star; $("fWrong").checked = draft.wrong;
  renderStatusChips(); updateCount();
}
function renderStatusChips(){
  const statuses = [...new Set([...STATUSES, ...WORDS.map(w => w.s)])].filter(Boolean);
  $("fStatus").innerHTML = statuses.map(s => `<button class="chip ${draft.status.includes(s)?"on":""}" data-s="${esc(s)}">${esc(s)}</button>`).join("");
  $("fStatus").querySelectorAll("button").forEach(b => b.onclick = () => {
    const s = b.dataset.s; draft.status = draft.status.includes(s) ? draft.status.filter(x => x !== s) : [...draft.status, s];
    renderStatusChips(); updateCount();
  });
}
function readDraft(){
  draft.from = parseInt($("fFrom").value) || 0; draft.to = parseInt($("fTo").value) || 0;
  draft.topic = $("fTopic").value; draft.star = $("fStar").checked; draft.wrong = $("fWrong").checked;
}
function updateCount(){ readDraft(); const n = WORDS.filter(w => inScope(w, draft)).length; $("fCount").textContent = `조건에 맞는 단어 ${n}개 · ★ ${stars.size}개 · 오답 모음 ${wrong.size}개`; }
["fFrom","fTo","fTopic","fStar","fWrong"].forEach(id => $(id).addEventListener("input", updateCount));
$("fApply").onclick = () => {
  readDraft(); scope = draft; LS.set("scope", scope);
  buildDeck(); $("scopePanel").hidden = true; $("scopeBtn").classList.remove("on");
  if(mode === "test" && test && !test.done){ /* keep running test */ }
  render(); toast(`${deck.length}단어로 설정했어요`);
};
$("fReset").onclick = () => {
  draft = JSON.parse(JSON.stringify(DEFAULT_SCOPE));
  $("fFrom").value = draft.from; $("fTo").value = draft.to; $("fTopic").value = ""; $("fStar").checked = false; $("fWrong").checked = false;
  renderStatusChips(); updateCount();
};
$("scopeBtn").onclick = () => {
  const p = $("scopePanel"); p.hidden = !p.hidden; $("importPanel").hidden = true;
  $("scopeBtn").classList.toggle("on", !p.hidden); $("importBtn").classList.remove("on");
  if(!p.hidden) openScope();
};
$("importBtn").onclick = () => {
  const p = $("importPanel"); p.hidden = !p.hidden; $("scopePanel").hidden = true;
  $("importBtn").classList.toggle("on", !p.hidden); $("scopeBtn").classList.remove("on");
  renderDataInfo();
};

/* ---------- CSV import ---------- */
function parseCSV(text){
  text = text.replace(/^﻿/, "");
  const rows = []; let row = [], f = "", q = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(q){
      if(c === '"'){ if(text[i+1] === '"'){ f += '"'; i++; } else q = false; }
      else f += c;
    } else if(c === '"') q = true;
    else if(c === ","){ row.push(f); f = ""; }
    else if(c === "\n" || c === "\r"){ if(c === "\r" && text[i+1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
    else f += c;
  }
  if(f !== "" || row.length){ row.push(f); rows.push(row); }
  return rows;
}
function handleFile(file){
  if(!file) return;
  const r = new FileReader();
  r.onload = () => {
    try{ importCSV(parseCSV(r.result), file.name); }
    catch(e){ toast("파일을 읽지 못했어요: " + e.message); }
  };
  r.readAsText(file, "utf-8");
}
function importCSV(rows, name){
  const hi = rows.findIndex(r => r.map(x => x.trim()).includes("번호"));
  if(hi < 0) throw new Error("'번호' 열이 없어요");
  const H = rows[hi].map(x => x.trim()); const col = k => H.indexOf(k);
  const body = rows.slice(hi + 1).filter(r => /^\d+$/.test((r[col("번호")] || "").trim()));
  const get = (r, k) => col(k) >= 0 ? (r[col(k)] || "").trim() : "";
  if(col("한자/표기") >= 0 && col("히라가나") >= 0 && col("한국어 뜻") >= 0 && col("최종") < 0){
    const list = body.map(r => ({ n:+get(r,"번호"), s:get(r,"학습상태") || "Not Yet", t:get(r,"주제"), w:get(r,"한자/표기"), k:get(r,"히라가나"),
      m:get(r,"한국어 뜻"), e:get(r,"예문"), ek:get(r,"예문 한글뜻"), p:get(r,"한글 발음"), memo:get(r,"학습 메모") })).filter(w => w.w);
    if(!list.length) throw new Error("단어 행이 없어요");
    list.sort((a,b) => a.n - b.n);
    WORDS = list; dataSource = `${name} (${new Date().toLocaleDateString("ko-KR")})`;
    LS.set("words", WORDS); LS.set("source", dataSource);
    buildDeck(); render(); renderDataInfo();
    toast(`단어 ${list.length}개를 불러왔어요`);
  } else if(col("최종") >= 0){
    let added = 0;
    body.forEach(r => { const v = get(r,"최종"); const n = +get(r,"번호"); if(v === "X" || v === "△"){ if(!wrong.has(n)) added++; wrong.add(n); } });
    LS.set("wrong", [...wrong]); render(); renderDataInfo();
    toast(`오답 모음에 ${added}개 추가 (총 ${wrong.size}개)`);
  } else throw new Error("단어장이나 채점표 형식이 아니에요");
}
function renderDataInfo(){ $("dataInfo").textContent = `현재: ${dataSource} · ${WORDS.length}단어 · 오답 모음 ${wrong.size}개`; }
$("drop").onclick = () => $("file").click();
$("file").onchange = e => { handleFile(e.target.files[0]); e.target.value = ""; };
["dragenter","dragover"].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); document.body.classList.add("dragging"); }));
["dragleave","drop"].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); if(ev === "drop" || !e.relatedTarget) document.body.classList.remove("dragging"); }));
document.addEventListener("drop", e => { const f = e.dataTransfer?.files?.[0]; if(f) handleFile(f); });
$("restoreDefault").onclick = () => {
  WORDS = DEFAULT_WORDS; dataSource = "기본 단어장";
  try{ localStorage.removeItem("n3v2_words"); }catch(e){} LS.set("source", dataSource);
  buildDeck(); render(); renderDataInfo(); toast("기본 단어장으로 되돌렸어요");
};
$("clearWrong").onclick = () => {
  if($("clearWrong").dataset.armed !== "1"){ $("clearWrong").dataset.armed = "1"; $("clearWrong").textContent = "한 번 더 누르면 비워요"; setTimeout(() => { $("clearWrong").dataset.armed = ""; $("clearWrong").textContent = "오답 모음 비우기"; }, 3000); return; }
  wrong.clear(); LS.set("wrong", []); $("clearWrong").dataset.armed = ""; $("clearWrong").textContent = "오답 모음 비우기";
  render(); renderDataInfo(); toast("오답 모음을 비웠어요");
};

/* ---------- test mode ---------- */
const norm = s => String(s || "").replace(/[\s\-ー~〜.·,]/g, "");
function guessReading(mine, key){
  if(!mine) return "X";
  const a = norm(mine), b = norm(key);
  if(a === b) return "O";
  // 장음(우/이), 촉음 받침(ㄱ/ㅅ/ㅂ/ㄷ), ん 받침(ㄴ/ㅇ/ㅁ), 어두 평음/격음 차이는 같게 봄
  const loose = s => {
    s = s.replace(/[우이]/g, "");
    let out = "";
    [...s].forEach((ch, i) => {
      const c = ch.charCodeAt(0) - 0xAC00;
      if(c < 0 || c > 11171){ out += ch; return; }
      let cho = Math.floor(c / 588), jung = Math.floor((c % 588) / 28), jong = c % 28;
      if([1,7,17,19].includes(jong)) jong = 19;
      if([4,21,16].includes(jong)) jong = 4;
      if(i === 0){ const m = {15:0, 16:3, 17:7, 14:12}; if(cho in m) cho = m[cho]; }
      out += String.fromCharCode(0xAC00 + cho*588 + jung*28 + jong);
    });
    return out;
  };
  return loose(a) === loose(b) ? "O" : "X";
}
function guessMeaning(mine, key){
  if(!mine) return "X";
  const stem = s => norm(s).replace(/\(.*?\)/g, "").replace(/(하다|하게|함|한|히|적인|이다|다)$/, "");
  const a = stem(mine);
  if(!a) return "X";
  const toks = String(key).split(/[,;/]|\s{2,}/).map(stem).filter(Boolean);
  return toks.some(t => t === a || (a.length >= 2 && (t.includes(a) || a.includes(t)))) ? "O" : "X";
}
function saveTest(){ LS.set("test", test); }
function startTest(order, limit){
  let items = WORDS.filter(w => inScope(w)).map(w => w.n);
  if(order === "shuffle") shuffle(items);
  if(limit > 0) items = items.slice(0, limit);
  if(!items.length){ toast("범위에 단어가 없어요"); return; }
  test = { items, i:0, ans:{}, done:false, grade:{}, started:new Date().toISOString(), label:scopeLabel() };
  saveTest(); renderTest();
}
function renderTest(){
  const box = $("test");
  $("scopeText").innerHTML = `범위 <b>${esc(test ? test.label : scopeLabel())}</b>`;
  if(!test){
    const n = WORDS.filter(w => inScope(w)).length;
    $("posText").textContent = ""; $("bar").style.width = "0";
    box.innerHTML = `
      <div class="panel">
        <h3>테스트 시작</h3>
        <div class="hint">단어를 보고 한글 발음과 뜻을 적어요. 모르는 칸은 비워 두고 넘어가도 돼요. 끝나면 정답과 비교해 O/X를 확인하고, 채점용 CSV로 내보낼 수 있어요.</div>
        <div class="row" style="gap:18px;align-items:flex-end">
          <div class="field"><span class="lbl">현재 범위</span><b>${esc(scopeLabel())} · ${n}단어</b></div>
          <div class="field"><label for="tOrder">순서</label><select id="tOrder"><option value="shuffle">섞어서</option><option value="seq">번호순</option></select></div>
          <div class="field"><label for="tLimit">문항 수</label><select id="tLimit"><option value="0">전체 (${n})</option>${[20,30,50,100].filter(x => x < n).map(x => `<option value="${x}">${x}개</option>`).join("")}</select></div>
        </div>
        <div class="row"><button class="btn primary" id="tStart" ${n ? "" : "disabled"}>시작</button><span class="hint">범위는 위의 <b>범위 설정</b>에서 바꿀 수 있어요.</span></div>
      </div>`;
    $("tStart").onclick = () => startTest($("tOrder").value, +$("tLimit").value);
    return;
  }
  if(test.done) return renderReview();
  const N = test.items.length, n = test.items[test.i], w = byNo(n) || {n, w:"?", k:"", m:"", p:""};
  const a = test.ans[n] || {p:"", m:""};
  $("posText").textContent = `${test.i+1} / ${N}`;
  $("bar").style.width = ((test.i+1)/N*100) + "%";
  box.innerHTML = `
    <div class="card">
      <div class="meta"><span class="no">No. ${w.n}</span><span>${esc(w.t || "")}</span></div>
      <div class="head"><div class="word jp">${esc(w.w)}</div></div>
      <div class="answers">
        <div class="field"><label for="aP">한글 발음</label><input id="aP" autocomplete="off" value="${esc(a.p)}" placeholder="예: 메ー쇼"></div>
        <div class="field"><label for="aM">뜻</label><input id="aM" autocomplete="off" value="${esc(a.m)}" placeholder="예: 명소"></div>
      </div>
    </div>
    <div class="nav" style="margin-top:14px">
      <button class="btn" id="tPrev" ${test.i ? "" : "disabled"}>← 이전</button>
      <button class="btn" id="tNext">${test.i === N-1 ? "제출" : "다음 →"}</button>
      <button class="btn" id="tQuit">그만하고 채점</button>
    </div>
    <div class="keys" style="margin-top:10px"><kbd>Enter</kbd> 발음 → 뜻 → 다음 · <kbd>Shift</kbd>+<kbd>Enter</kbd> 이전 · 빈칸으로 넘기면 모름 처리</div>`;
  const P = $("aP"), M = $("aM");
  const store = () => { test.ans[n] = {p:P.value.trim(), m:M.value.trim()}; saveTest(); };
  P.oninput = M.oninput = store;
  P.onkeydown = e => { if(e.isComposing) return; if(e.key === "Enter"){ e.preventDefault(); e.shiftKey ? tGo(-1) : M.focus(); } };
  M.onkeydown = e => { if(e.isComposing) return; if(e.key === "Enter"){ e.preventDefault(); e.shiftKey ? P.focus() : tGo(1); } };
  $("tPrev").onclick = () => tGo(-1);
  $("tNext").onclick = () => tGo(1);
  $("tQuit").onclick = () => finishTest(true);
  P.focus();
}
function tGo(d){
  const N = test.items.length;
  if(d > 0 && test.i === N - 1) return finishTest(false);
  test.i = Math.max(0, Math.min(N - 1, test.i + d)); saveTest(); renderTest();
}
function finishTest(early){
  if(early){ const cur = test.ans[test.items[test.i]]; const answered = cur && (cur.p || cur.m); test.items = test.items.slice(0, test.i + (answered ? 1 : 0)); if(!test.items.length){ test = null; saveTest(); renderTest(); return; } }
  test.done = true;
  test.items.forEach(n => {
    const w = byNo(n) || {}, a = test.ans[n] || {p:"", m:""};
    test.grade[n] = { p: guessReading(a.p, w.p), m: guessMeaning(a.m, w.m) };
  });
  saveTest(); renderTest();
}
function renderReview(){
  const box = $("test"), N = test.items.length;
  const g = test.items.map(n => test.grade[n]);
  const pO = g.filter(x => x.p === "O").length, mO = g.filter(x => x.m === "O").length, both = g.filter(x => x.p === "O" && x.m === "O").length;
  $("posText").textContent = `${N}문항 완료`; $("bar").style.width = "100%";
  box.innerHTML = `
    <div class="panel">
      <h3>결과</h3>
      <div class="score">
        <div class="stat"><div class="v">${both} / ${N}</div><div class="l">발음·뜻 모두 정답</div></div>
        <div class="stat"><div class="v">${pO}</div><div class="l">발음 정답</div></div>
        <div class="stat"><div class="v">${mO}</div><div class="l">뜻 정답</div></div>
      </div>
      <div class="hint">O/X는 자동 추정이에요. 장음 표기나 비슷한 뜻은 틀리게 잡힐 수 있으니 버튼을 눌러 고쳐 주세요. 정확한 채점이 필요하면 CSV를 내보내 Claude에게 주세요.</div>
      <div class="row">
        <button class="btn primary" id="rExport">채점용 CSV 내보내기</button>
        <button class="btn" id="rWrong">오답 모음 업데이트</button>
        <button class="btn" id="rRetry">틀린 것만 다시</button>
        <button class="btn" id="rNew">새 테스트</button>
      </div>
    </div>
    <div class="tbl"><table>
      <thead><tr><th>번호</th><th>단어</th><th>발음 (내 답 / 정답)</th><th></th><th>뜻 (내 답 / 정답)</th><th></th></tr></thead>
      <tbody>${test.items.map(n => {
        const w = byNo(n) || {}, a = test.ans[n] || {}, gr = test.grade[n];
        const cls = gr.p === "O" && gr.m === "O" ? "ok" : "no";
        const ox = (k) => `<div class="ox"><button data-n="${n}" data-k="${k}" data-v="O" class="${gr[k]==="O"?"onO":""}">O</button><button data-n="${n}" data-k="${k}" data-v="X" class="${gr[k]==="X"?"onX":""}">X</button></div>`;
        return `<tr class="${cls}"><td>${n}</td><td class="w jp">${esc(w.w)}</td>
          <td><div class="mine">${esc(a.p) || "<span class='corr'>(빈칸)</span>"}</div><div class="corr">${esc(w.p)} · <span class="jp">${esc(w.k)}</span></div></td><td>${ox("p")}</td>
          <td><div class="mine">${esc(a.m) || "<span class='corr'>(빈칸)</span>"}</div><div class="corr">${esc(w.m)}</div></td><td>${ox("m")}</td></tr>`;
      }).join("")}</tbody></table></div>`;
  box.querySelectorAll(".ox button").forEach(b => b.onclick = () => { test.grade[+b.dataset.n][b.dataset.k] = b.dataset.v; saveTest(); renderReview(); });
  $("rExport").onclick = exportCSV;
  $("rWrong").onclick = () => {
    let add = 0, rem = 0;
    test.items.forEach(n => { const gr = test.grade[n]; if(gr.p === "O" && gr.m === "O"){ if(wrong.delete(n)) rem++; } else { if(!wrong.has(n)) add++; wrong.add(n); } });
    LS.set("wrong", [...wrong]); toast(`오답 모음: ${add}개 추가, ${rem}개 제외 (총 ${wrong.size}개)`);
  };
  $("rRetry").onclick = () => {
    const items = test.items.filter(n => !(test.grade[n].p === "O" && test.grade[n].m === "O"));
    if(!items.length){ toast("틀린 단어가 없어요"); return; }
    test = { items:shuffle(items), i:0, ans:{}, done:false, grade:{}, started:new Date().toISOString(), label:"직전 테스트의 틀린 단어" };
    saveTest(); renderTest();
  };
  $("rNew").onclick = () => { test = null; saveTest(); renderTest(); };
}
function csvCell(v){ v = String(v ?? ""); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function exportCSV(){
  const head = ["구분(불필요)","번호","한자/표기","한글 발음","뜻","자가채점(발음)","자가채점(뜻)"];
  const lines = [head.join(",")];
  test.items.forEach((n, i) => { const w = byNo(n) || {}, a = test.ans[n] || {}, g = test.grade[n] || {};
    lines.push([i+1, n, w.w, a.p, a.m, g.p, g.m].map(csvCell).join(",")); });
  const blob = new Blob(["﻿" + lines.join("\n")], {type:"text/csv;charset=utf-8"});
  const d = new Date(), pad = x => String(x).padStart(2, "0");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `test_raw_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast("다운로드 폴더에 저장했어요");
}

/* ---------- mode / keys ---------- */
function render(){
  $("tabStudy").classList.toggle("on", mode === "study");
  $("tabTest").classList.toggle("on", mode === "test");
  $("study").hidden = mode !== "study"; $("test").hidden = mode !== "test";
  mode === "study" ? renderStudy() : renderTest();
}
$("tabStudy").onclick = () => { mode = "study"; LS.set("mode", mode); render(); };
$("tabTest").onclick = () => { mode = "test"; LS.set("mode", mode); render(); };
$("prev").onclick = () => move(-1);
$("next").onclick = () => move(1);
$("hideBtn").onclick = () => { quiz = !quiz; renderStudy(); };
$("shuffleBtn").onclick = () => { shuffled = !shuffled; const cur = deck[idx]?.n; buildDeck(shuffled ? null : cur); renderStudy(); };
$("card").onclick = () => { if(quiz){ quiz = false; renderStudy(); } };
document.addEventListener("keydown", e => {
  if(mode !== "study" || e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = (e.target.tagName || "").toLowerCase();
  if(tag === "input" || tag === "select" || tag === "textarea") return;
  switch(e.key){
    case "ArrowRight": case "ArrowDown": e.preventDefault(); move(1); break;
    case "ArrowLeft": case "ArrowUp": e.preventDefault(); move(-1); break;
    case " ": e.preventDefault(); quiz = !quiz; renderStudy(); break;
    case "s": case "S": case "ㄴ": $("shuffleBtn").click(); break;
    case "f": case "F": case "ㄹ": toggleStar(); break;
    case "Home": idx = 0; renderStudy(); break;
    case "End": idx = deck.length - 1; renderStudy(); break;
  }
});
let sx = null;
$("card").addEventListener("touchstart", e => sx = e.touches[0].clientX, {passive:true});
$("card").addEventListener("touchend", e => { if(sx === null) return; const dx = e.changedTouches[0].clientX - sx; if(Math.abs(dx) > 50) move(dx < 0 ? 1 : -1); sx = null; });

buildDeck(LS.get("pos", null));
render();
</script>
